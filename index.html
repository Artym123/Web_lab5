<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 5 — Калькулятор стоимости заказа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="bg-primary-subtle border-bottom py-3 mb-4">
        <div class="container">
            <h1 class="h4 mb-0">Калькулятор стоимости заказа</h1>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-body">

                        <form id="order-form" novalidate>

                            <div class="mb-3">
                                <label for="product" class="form-label">Товар:</label>
                                <select class="form-select" id="product" name="product">
                                    <option value="100">Товар A — 100 ₽</option>
                                    <option value="250">Товар B — 250 ₽</option>
                                    <option value="500">Товар C — 500 ₽</option>
                                    <option value="1200">Товар D — 1200 ₽</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="quantity" class="form-label">Количество:</label>
                                <input type="text" class="form-control" id="quantity" name="quantity"
                                       placeholder="Введите целое число" autocomplete="off">
                                <div id="error" class="text-danger mt-2" role="alert"></div>
                            </div>

                            <button type="submit" class="btn btn-primary" id="calc-btn">
                                Подсчитать стоимость
                            </button>

                        </form>

                        <div id="result" class="mt-4 fs-5 fw-bold" aria-live="polite"></div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-primary-subtle border-top py-3 mt-4">
        <div class="container text-center">
            Балакин Артем
        </div>
    </footer>

</body>
</html>
